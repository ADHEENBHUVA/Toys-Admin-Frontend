<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(10, 8)">
    <!-- Base subtle circle -->
    <circle cx="37" cy="37" r="36" fill="#F8FAFC" />
    <!-- Outer red ring -->
    <circle cx="37" cy="37" r="33" fill="none" stroke="#E31E24" stroke-width="4.5" />
    <!-- Inner red circle -->
    <circle cx="37" cy="37" r="22" fill="#FFFFFF" stroke="#E31E24" stroke-width="3.2" />
    <!-- Left eye -->
    <circle cx="30" cy="32" r="2.8" fill="#E31E24" />
    <!-- Right eye -->
    <circle cx="44" cy="32" r="2.8" fill="#E31E24" />
    <!-- Smile arc -->
    <path d="M 28 40 C 31 48, 43 48, 46 40" fill="none" stroke="#E31E24" stroke-width="3.2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(98, 0)">
    <!-- Little Joys -->
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Nunito', sans-serif" font-size="38" font-weight="900" fill="#1C274C" letter-spacing="-0.5px">Little Joys</text>
    <!-- KIDS & BABY STORE -->
    <text x="2" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#E31E24" letter-spacing="3.2px">KIDS &amp; BABY STORE</text>
  </g>
</svg>